name: CI

on:
  push:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests (JUnit)
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile=reports/junit.xml

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Vitest Tests
          path: reports/junit.xml
          reporter: java-junit
